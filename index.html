<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azisly.ai CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{box-sizing:border-box} 
    :root{color-scheme:light;--navy:#0F172A;--blue:#2563eb}
    body{margin:0;background:linear-gradient(135deg,#f8fafc 0%,#eef3fb 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e293b}
    button,input,select{font-family:inherit}button{cursor:pointer;transition:.18s ease}button:active{transform:scale(.98)}
    ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
    aside{box-shadow:8px 0 28px rgba(15,23,42,.10)}aside nav button{position:relative}aside nav button:hover{transform:translateX(2px)}
    header{backdrop-filter:blur(16px);box-shadow:0 1px 12px rgba(15,23,42,.025)}
    main{max-width:1600px;margin:0 auto}
    main>div:first-child h1,main>div:first-child>h1{letter-spacing:-.02em}
    .grid>div.bg-white,.grid>div>div.bg-white{box-shadow:0 8px 28px rgba(15,23,42,.045);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .grid>div.bg-white:hover,.grid>div>div.bg-white:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.08);border-color:#dbe5f1}
    input:focus,select:focus{box-shadow:0 0 0 3px rgba(37,99,235,.10);border-color:#60a5fa!important}
    header button:hover,form button:hover{box-shadow:0 8px 18px rgba(37,99,235,.15)}
    table tbody tr{transition:.16s ease}table tbody tr:hover{background:#f8fafc}
    form{animation:modalIn .18s ease-out}@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
    @media(max-width:1100px){aside{width:220px!important}.ml-\[248px\]{margin-left:220px!important}.grid-cols-6{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-cols-3{grid-template-columns:1fr 1fr}.grid-cols-\[1\.55fr_1fr\]{grid-template-columns:1fr}}
    @media(max-width:760px){aside{width:72px!important}aside>div:first-child{padding:0!important;justify-content:center}aside>div:first-child>div:last-child,aside nav button span,aside>div:last-child{display:none}aside nav button{justify-content:center;padding:0}.ml-\[248px\]{margin-left:72px!important}header{padding:0 16px!important}header>div:first-child{width:180px!important}header>div:last-child>div:first-child{display:none}.grid-cols-6,.grid-cols-3{grid-template-columns:1fr 1fr}main{padding:18px!important}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useState}=React;
const Icon=({name,size=18})=>{const ref=React.useRef(null);useEffect(()=>{if(ref.current&&window.lucide){ref.current.innerHTML=`<i data-lucide="${name}"></i>`;window.lucide.createIcons({attrs:{width:size,height:size}})}},[name,size]);return <span ref={ref} className="inline-flex"/>};
const nav=[["Dashboard","layout-dashboard"],["Customers","users"],["To-do","circle-check-big"],["Calendar","calendar-days"],["Sales & Payments","credit-card"],["Career Engagement","briefcase-business"],["Reports","chart-no-axes-combined"],["Settings","settings"]];
const rupee=n=>`₹${Number(n).toLocaleString("en-IN")}`;
const seedCustomers=[{id:1,name:"Aarav Sharma",email:"aarav@example.com",phone:"+91 98765 43210",course:"AI Corporate Analyst",value:2999,status:"Active"},{id:2,name:"Meera Patel",email:"meera@example.com",phone:"+91 98112 22001",course:"Corporate Championship",value:118000,status:"Lead"},{id:3,name:"Ishaan Verma",email:"ishaan@example.com",phone:"+91 98990 44120",course:"Entrepreneurship & Innovation",value:7080,status:"Active"}];
const seedTasks=[{id:1,title:"Follow up with Aarav Sharma",time:"10:30 AM",done:false,type:"Call"},{id:2,title:"Send proposal to Meera Patel",time:"12:00 PM",done:false,type:"Email"},{id:3,title:"Prepare monthly sales report",time:"3:30 PM",done:true,type:"Work"}];
function App(){
 const [active,setActive]=useState("Dashboard");
 const [customers,setCustomers]=useState(()=>JSON.parse(localStorage.getItem("azisly_customers")||"null")||seedCustomers);
 const [tasks,setTasks]=useState(()=>JSON.parse(localStorage.getItem("azisly_tasks")||"null")||seedTasks);
 const [modal,setModal]=useState(null); const [search,setSearch]=useState("");
 useEffect(()=>localStorage.setItem("azisly_customers",JSON.stringify(customers)),[customers]);useEffect(()=>localStorage.setItem("azisly_tasks",JSON.stringify(tasks)),[tasks]);
 const date=new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}).format(new Date());
 const kpis=[{label:"Total Revenue",value:"₹12,48,900",change:"+12.5%",icon:"indian-rupee",color:"bg-blue-50 text-blue-600"},{label:"Total Units Sold",value:"148",change:"+8.2%",icon:"package-check",color:"bg-violet-50 text-violet-600"},{label:"Total Customers",value:String(customers.length),change:"+5.1%",icon:"users",color:"bg-emerald-50 text-emerald-600"},{label:"Active Leads",value:"32",change:"+10.4%",icon:"user-round-plus",color:"bg-amber-50 text-amber-600"},{label:"Pending Payments",value:"₹86,500",change:"-3.2%",icon:"wallet-cards",color:"bg-rose-50 text-rose-600"},{label:"Today's Tasks",value:String(tasks.filter(t=>!t.done).length),change:"Today",icon:"list-checks",color:"bg-cyan-50 text-cyan-600"}];
 const courses=[{name:"AI Corporate Analyst Program",sub:"15 Days AI Live Project",price:2999,earned:584805,units:195,pct:46.8,color:"#2563eb"},{name:"Azisly Corporate Championship Programme",sub:"Leadership & strategy program",price:118000,earned:472000,units:4,pct:37.8,color:"#7c3aed"},{name:"AI-Driven Entrepreneurship & Innovation",sub:"Build and scale with AI",price:7080,earned:192095,units:27,pct:15.4,color:"#f97316"}];
 const addTask=e=>{e.preventDefault();const title=new FormData(e.target).get("title").trim();if(title)setTasks(p=>[...p,{id:Date.now(),title,time:"5:00 PM",done:false,type:"Task"}]);setModal(null)};
 const addCustomer=e=>{e.preventDefault();const d=new FormData(e.target);setCustomers(p=>[...p,{id:Date.now(),name:d.get("name"),email:d.get("email"),phone:d.get("phone"),course:d.get("course"),value:Number(d.get("value")||0),status:"Lead"}]);setModal(null)};
 return <div className="min-h-screen text-slate-800">
  <aside className="fixed inset-y-0 left-0 z-30 w-[248px] bg-[#0F172A] text-slate-300 flex flex-col"><div className="h-[72px] flex items-center px-6 border-b border-slate-700/50"><div className="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold mr-3">A</div><div className="text-white font-semibold text-[15px]">Azisly.ai CRM</div></div>
   <nav className="flex-1 px-3 py-5 space-y-1">{nav.map(([label,icon])=> <button key={label} onClick={()=>setActive(label)} className={`w-full h-11 px-3 rounded-lg flex items-center gap-3 text-[13.5px] ${active===label?"bg-blue-600 text-white":"text-slate-400 hover:bg-slate-800 hover:text-white"}`}><Icon name={icon}/><span>{label}</span></button>)}</nav>
   <div className="mx-4 mb-5 px-3 py-3 border-t border-slate-700/60"><p className="text-[11.5px] text-slate-400 pt-3">Local browser CRM</p><p className="text-[11.5px] text-slate-500">Single-user demonstration</p></div>
  </aside>
  <div className="ml-[248px]"><header className="sticky top-0 z-20 h-[72px] bg-white border-b border-slate-200 px-7 flex items-center justify-between"><div className="relative w-[320px]"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={17}/></span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search customers" className="w-full h-[42px] pl-10 pr-4 rounded-lg border border-slate-200 bg-slate-50 text-[13px] outline-none focus:border-blue-400"/></div><div className="flex items-center gap-3"><div className="flex items-center gap-2 text-[13px] text-slate-500 mr-2"><Icon name="calendar" size={16}/>{date}</div><button onClick={()=>setModal("task")} className="h-10 px-4 rounded-lg border border-slate-200 bg-white text-[13px] font-medium flex items-center gap-2"><Icon name="plus" size={16}/>Task</button><button onClick={()=>setModal("customer")} className="h-10 px-4 rounded-lg bg-blue-600 text-white text-[13px] font-medium flex items-center gap-2"><Icon name="plus" size={16}/>Customer</button></div></header>
   <main className="p-7">{active==="Dashboard"?<Dashboard kpis={kpis} courses={courses} tasks={tasks} setTasks={setTasks} setActive={setActive}/>:<SimpleView title={active} customers={customers} tasks={tasks} setTasks={setTasks} search={search}/>}</main>
  </div>
  {modal&&<Modal type={modal} onClose={()=>setModal(null)} onTask={addTask} onCustomer={addCustomer}/>}</div>
}
function Dashboard({kpis,courses,tasks,setTasks,setActive}){const vals=[38,44,41,52,49,58,63,57,68,72,76,84],max=Math.max(...vals);const pts=vals.map((v,i)=>`${i*(600/11)},${155-v/max*125}`).join(" ");return <><div className="mb-5"><h1 className="text-[22px] font-semibold text-slate-900">Dashboard</h1><p className="text-[12.5px] text-slate-500 mt-1">Overview of your business performance</p></div>
 <div className="grid grid-cols-6 gap-4">{kpis.map(k=><div key={k.label} className="bg-white border border-slate-200 rounded-xl p-4 min-h-[126px]"><div className="flex items-center justify-between"><span className="text-[12px] text-slate-500">{k.label}</span><div className={`w-8 h-8 rounded-lg flex items-center justify-center ${k.color}`}><Icon name={k.icon} size={16}/></div></div><div className="text-[21px] font-semibold text-slate-900 mt-3">{k.value}</div><div className={`text-[11.5px] mt-2 ${k.change.startsWith("-")?"text-rose-500":"text-emerald-500"}`}>{k.change} <span className="text-slate-400">from last month</span></div></div>)}</div>
 <section className="mt-6"><div className="flex items-center justify-between mb-3"><h2 className="text-[15px] font-semibold">Course performance</h2><button className="text-[12px] text-blue-600 font-medium">View details</button></div><div className="grid grid-cols-3 gap-4">{courses.map(c=><div key={c.name} className="bg-white border border-slate-200 rounded-xl p-5"><div className="flex justify-between gap-3"><div><h3 className="text-[13.5px] font-semibold leading-5">{c.name}</h3><p className="text-[11.5px] text-slate-400 mt-1">{c.sub}</p></div><div className="text-[12px] text-slate-500 whitespace-nowrap">{rupee(c.price)}</div></div><div className="grid grid-cols-3 mt-5"><div><p className="text-[10.5px] text-slate-400">Earned</p><p className="text-[15px] font-semibold mt-1">{rupee(c.earned)}</p></div><div><p className="text-[10.5px] text-slate-400">Units sold</p><p className="text-[15px] font-semibold mt-1">{c.units}</p></div><div><p className="text-[10.5px] text-slate-400">Revenue</p><p className="text-[15px] font-semibold mt-1">{c.pct}%</p></div></div><div className="mt-4 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${c.pct*1.8}%`,background:c.color}}/></div></div>)}</div></section>
 <div className="grid grid-cols-[1.55fr_1fr] gap-4 mt-6"><div className="bg-white border border-slate-200 rounded-xl p-5 h-[280px]"><div className="flex justify-between"><div><h2 className="text-[15px] font-semibold">Revenue over time</h2><p className="text-[11.5px] text-slate-400 mt-1">Monthly revenue performance</p></div><select className="h-8 rounded-lg border border-slate-200 px-2 text-[11.5px] text-slate-500"><option>Last 12 months</option></select></div><svg viewBox="0 0 600 180" className="w-full h-[205px] mt-1" preserveAspectRatio="none">{[30,70,110,150].map(y=><line key={y} x1="0" x2="600" y1={y} y2={y} stroke="#eef2f7"/>)}<polygon points={`0,155 ${pts} 600,155`} fill="#dbeafe" opacity=".7"/><polyline points={pts} fill="none" stroke="#2563eb" strokeWidth="3"/> {vals.map((v,i)=><circle key={i} cx={i*(600/11)} cy={155-v/max*125} r="3" fill="#2563eb"/>)}</svg><div className="flex justify-between text-[10.5px] text-slate-400 -mt-7"><span>Jan</span><span>Mar</span><span>May</span><span>Jul</span><span>Sep</span><span>Nov</span></div></div>
 <div className="bg-white border border-slate-200 rounded-xl p-5 h-[280px]"><div className="flex justify-between mb-4"><h2 className="text-[15px] font-semibold">Today's tasks</h2><button onClick={()=>setActive("To-do")} className="text-[12px] text-blue-600 font-medium">View all</button></div>{tasks.slice(0,4).map(t=><div key={t.id} className="flex items-center gap-3 py-3 border-b border-slate-100"><button onClick={()=>setTasks(p=>p.map(x=>x.id===t.id?{...x,done:!x.done}:x))} className={`w-5 h-5 rounded-md border flex items-center justify-center ${t.done?"bg-blue-600 border-blue-600 text-white":"border-slate-300"}`}>{t.done&&<Icon name="check" size={13}/>}</button><div className="flex-1"><p className={`text-[12.5px] ${t.done?"text-slate-400 line-through":"text-slate-700"}`}>{t.title}</p><p className="text-[10.5px] text-slate-400 mt-1">{t.time}</p></div><span className="text-[10.5px] px-2 py-1 rounded-md bg-slate-100 text-slate-500">{t.type}</span></div>)}</div></div></>}
function SimpleView({title,customers,tasks,setTasks,search}){const filtered=customers.filter(c=>`${c.name} ${c.email} ${c.phone}`.toLowerCase().includes(search.toLowerCase()));return <><div className="mb-5"><h1 className="text-[22px] font-semibold">{title}</h1><p className="text-[12.5px] text-slate-500 mt-1">Manage your {title.toLowerCase()} information</p></div>{["Customers","Sales & Payments","Career Engagement"].includes(title)?<div className="bg-white border border-slate-200 rounded-xl overflow-hidden"><table className="w-full text-left"><thead className="bg-slate-50 text-[11.5px] text-slate-500"><tr><th className="px-5 py-3">Customer</th><th className="px-5 py-3">Contact</th><th className="px-5 py-3">Course</th><th className="px-5 py-3">Value</th><th className="px-5 py-3">Status</th></tr></thead><tbody>{filtered.map(c=><tr key={c.id} className="border-t border-slate-100 text-[12.5px]"><td className="px-5 py-4 font-medium">{c.name}</td><td className="px-5 py-4">{c.email}<p className="text-slate-400 mt-1">{c.phone}</p></td><td className="px-5 py-4">{c.course}</td><td className="px-5 py-4">{rupee(c.value)}</td><td className="px-5 py-4"><span className={`px-2 py-1 rounded-md ${c.status=== "Active"?"bg-emerald-50 text-emerald-600":"bg-amber-50 text-amber-600"}`}>{c.status}</span></td></tr>)}</tbody></table></div>:<div className="grid grid-cols-2 gap-4"><div className="bg-white border border-slate-200 rounded-xl p-5"><h2 className="font-semibold mb-4">Today's tasks</h2>{tasks.map(t=><div key={t.id} className="flex gap-3 py-3 border-b border-slate-100"><button onClick={()=>setTasks(p=>p.map(x=>x.id===t.id?{...x,done:!x.done}:x))} className={`w-5 h-5 rounded-md border ${t.done?"bg-blue-600":""}`}/><span className="text-[13px]">{t.title}</span></div>)}</div><div className="bg-white border border-slate-200 rounded-xl p-5"><h2 className="font-semibold mb-2">{title}</h2><p className="text-[13px] text-slate-500">This section is ready for your CRM workflow.</p></div></div>}</>}
function Modal({type,onClose,onTask,onCustomer}){return <div className="fixed inset-0 z-50 bg-slate-950/40 flex items-center justify-center p-4" onMouseDown={e=>e.target===e.currentTarget&&onClose()}><form onSubmit={type=== "task"?onTask:onCustomer} className="w-[420px] bg-white rounded-xl shadow-2xl p-6"><div className="flex justify-between mb-5"><h2 className="text-[17px] font-semibold">{type=== "task"?"Add task":"Add customer"}</h2><button type="button" onClick={onClose}><Icon name="x" size={18}/></button></div>{type=== "task"?<><label className="text-[12px] font-medium">Task title</label><input autoFocus name="title" required placeholder="Enter task title" className="mt-2 w-full h-11 px-3 rounded-lg border border-slate-200 text-[13px] outline-none"/><button className="mt-5 w-full h-11 rounded-lg bg-blue-600 text-white text-[13px]">Create task</button></>:<div className="space-y-3"><input autoFocus required name="name" placeholder="Full name" className="w-full h-11 px-3 rounded-lg border border-slate-200 text-[13px]"/><input required type="email" name="email" placeholder="Email address" className="w-full h-11 px-3 rounded-lg border border-slate-200 text-[13px]"/><input name="phone" placeholder="Phone number" className="w-full h-11 px-3 rounded-lg border border-slate-200 text-[13px]"/><input name="course" placeholder="Course" className="w-full h-11 px-3 rounded-lg border border-slate-200 text-[13px]"/><input type="number" name="value" placeholder="Value (₹)" className="w-full h-11 px-3 rounded-lg border border-slate-200 text-[13px]"/><button className="w-full h-11 rounded-lg bg-blue-600 text-white text-[13px]">Add customer</button></div>}</form></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>cd "c:\Users\ASUS\Desktop\Azisly.ai"
